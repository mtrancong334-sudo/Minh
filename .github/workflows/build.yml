name: Build Android .so Library

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cài đặt bộ biên dịch ARM64
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-aarch64-linux-gnu

    - name: Biên dịch Minh.cpp sang .so
      run: |
        aarch64-linux-gnu-g++ -O3 -fPIC -shared Minh.cpp -o libaimlock.so

    - name: Tải file .so lên Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: libaimlock-arm64
        path: libaimlock.so
