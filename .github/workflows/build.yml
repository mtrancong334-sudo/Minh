name: Build Android .so Library

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile Minh.cpp to .so
      run: |
        # Tự động tìm thư mục Android NDK mới nhất trên hệ thống GitHub
        NDK_PATH=$(find $ANDROID_SDK_ROOT/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
        echo "Dùng NDK tại: $NDK_PATH"
        
        # Biên dịch file Minh.cpp thành file libaimlock.so
        $NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++ \
        -O3 -fPIC -shared Minh.cpp -o libaimlock.so

    - name: Upload Compiled .so Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libaimlock-arm64
        path: libaimlock.so
